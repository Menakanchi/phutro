# Đợt 2 (15/11/2026): 4 xe chưa hiệu chuẩn + ca bổ sung cho e-tron + edge case (E1–E6) + ca lặp (R). 205 run. Chạy:
#   .venv\Scripts\python bench.py --cases cases_dot2.yaml run
# Thiết kế từng nhóm: THIET-KE.md mục 13. Không AEB (lệnh phanh cố định) như đợt 1.
#
# Lưu ý với 4 xe chưa hiệu chuẩn: phanh 100% đo được chỉ 1,77–6,01 m/s², nên mức đích lớn hơn số đó đều thành bàn đạp 1,0.
# Vì vậy X2 dùng mức đích 1,5 / 3,0 m/s² và "max", không dùng 4 / 8 như e-tron.

defaults:
  ego_kmh: 40
  a: max
  ped_mps: 1.5
  trigger_m: 25
  stop_at_curb: false
  weather: CLEAR
  tire_friction_scale: 1.0
  vehicle: etron
  torque_scale: 1.0
  mass_scale: 1.0

cases:
  # ---------------------------------------------------------------- 4 xe chưa hiệu chuẩn
  # X1 — Hiệu chuẩn phanh 100%: tìm hệ số mô-men để phanh hết cỡ ≈ 9,5 m/s² (max_brake_decel của xe trong DB). 4 xe × 5 hệ số × 4 tốc độ.
  - id: "X1-{vehicle}-t{torque_scale}-{ego_kmh}"
    group: X1
    kind: brake
    a: max
    grid: {vehicle: [model3, patrol, sprinter, hgv], torque_scale: [1.0, 1.5, 2.0, 2.5, 3.0], ego_kmh: [40, 50, 60, 70]}

  # X2 — Độ lệch so với mô hình ở physics mặc định (mô-men như trong DB): 4 xe × 3 tốc độ × 3 mức đích.
  - id: "X2-{vehicle}-{ego_kmh}-{a}"
    group: X2
    kind: brake
    grid: {vehicle: [model3, patrol, sprinter, hgv], ego_kmh: [20, 40, 60], a: [1.5, 3.0, max]}

  # X3 — Đường ướt, phanh 100%: CARLA có giảm bám theo thời tiết với các xe này không. 4 xe × 2 tốc độ × 2 thời tiết.
  - id: "X3-{vehicle}-{ego_kmh}-{weather}"
    group: X3
    kind: brake
    a: max
    grid: {vehicle: [model3, patrol, sprinter, hgv], ego_kmh: [40, 60], weather: [RAIN, HEAVY_RAIN]}

  # X4 — Độ lặp lại: thêm 2 lần cho ca gốc X1-<xe>-t1.0-50 của mỗi xe → mỗi xe 3 mẫu.
  - id: "X4-model3"
    group: X4
    kind: brake
    vehicle: model3
    ego_kmh: 50
    same_as: X1-model3-t1.0-50
    repeat: 2
  - id: "X4-patrol"
    group: X4
    kind: brake
    vehicle: patrol
    ego_kmh: 50
    same_as: X1-patrol-t1.0-50
    repeat: 2
  - id: "X4-sprinter"
    group: X4
    kind: brake
    vehicle: sprinter
    ego_kmh: 50
    same_as: X1-sprinter-t1.0-50
    repeat: 2
  - id: "X4-hgv"
    group: X4
    kind: brake
    vehicle: hgv
    ego_kmh: 50
    same_as: X1-hgv-t1.0-50
    repeat: 2

  # ---------------------------------------------------------------- e-tron bổ sung
  # B1 — Ngưỡng vùng tốc độ thấp: cú dừng gấp bắt đầu ở đâu (đợt 1 chỉ có 20 km/h trở lên).
  - id: "B1-{ego_kmh}-{a}"
    group: B1
    kind: brake
    grid: {ego_kmh: [10, 15, 25], a: [8.0, max]}

  # B2 — Tốc độ cao 80 km/h (ngoài dải đợt 1).
  - id: "B2-80-{a}"
    group: B2
    kind: brake
    ego_kmh: 80
    grid: {a: [4.0, 8.0, max]}

  # B3 — Bàn đạp nhẹ (0,22 / 0,33): độ tuyến tính bàn đạp ở mức thấp.
  - id: "B3-{ego_kmh}-{a}"
    group: B3
    kind: brake
    grid: {ego_kmh: [40, 60], a: [2.0, 3.0]}

  # B4 — Chở thêm tải: khối lượng × 1,15 (~2415 kg) ở 50 km/h.
  - id: "B4-50-{a}"
    group: B4
    kind: brake
    ego_kmh: 50
    mass_scale: 1.15
    grid: {a: [8.0, max]}

  # B5 — Theo ma trận Euro NCAP AEB người đi bộ: người đi 5 km/h (1,39 m/s), xe 20–60 km/h.
  - id: "B5-xe-{ego_kmh}"
    group: B5
    kind: combined
    a: 8.0
    ped_mps: 1.39
    grid: {ego_kmh: [20, 30, 50, 60]}
  - id: "B5-nguoi-1.39"
    group: B5
    kind: walker
    ped_mps: 1.39
  - id: "B5-le-1.39"
    group: B5
    kind: walker
    ped_mps: 1.39
    stop_at_curb: true

  # ---------------------------------------------------------------- Edge case (giá trị biên)
  # E1 — Tốc độ biên (e-tron): 10 km/h phanh nhẹ (cả quá trình nằm trong vùng < 6 m/s), 90–100 km/h (ngoài dải đã đo).
  - id: "E1-10-2.0"
    group: E1
    kind: brake
    ego_kmh: 10
    a: 2.0
  - id: "E1-{ego_kmh}-{a}"
    group: E1
    kind: brake
    grid: {ego_kmh: [90, 100], a: [max]}
  - id: "E1-100-8.0"
    group: E1
    kind: brake
    ego_kmh: 100
    a: 8.0

  # E2 — Mức phanh biên: rất nhẹ (bàn đạp 0,05 / 0,11 — có vùng chết không; chạy 20 km/h để không quá giới hạn 25 s mỗi run),
  # sát max (9,0) và vượt max (12 → kẹp 1,0) ở 40 km/h.
  - id: "E2-20-{a}"
    group: E2
    kind: brake
    ego_kmh: 20
    grid: {a: [0.5, 1.0]}
  - id: "E2-40-{a}"
    group: E2
    kind: brake
    grid: {a: [9.0, 12.0]}

  # E3 — Ma sát biên, phanh 100%: lốp 0,3 (gần băng), lốp 1,5 (bám hơn mặc định), mưa to + lốp 0,65 (chồng hai yếu tố).
  - id: "E3-{ego_kmh}-tf0.3"
    group: E3
    kind: brake
    tire_friction_scale: 0.3
    grid: {ego_kmh: [40, 60]}
  - id: "E3-60-tf1.5"
    group: E3
    kind: brake
    ego_kmh: 60
    tire_friction_scale: 1.5
  - id: "E3-40-heavy-tf0.65"
    group: E3
    kind: brake
    weather: HEAVY_RAIN
    tire_friction_scale: 0.65

  # E4 — Người đi bộ biên: 0,5 m/s (rất chậm) và 8 m/s (chạy nước rút), đi thẳng và dừng ở lề.
  - id: "E4-{ped_mps}"
    group: E4
    kind: walker
    grid: {ped_mps: [0.5, 8.0]}
  - id: "E4-le-{ped_mps}"
    group: E4
    kind: walker
    stop_at_curb: true
    grid: {ped_mps: [0.5, 8.0]}

  # E5 — Xe + người biên: kích hoạt sát (5 m) / xa (80 m), người chạy trước xe nhanh, người rất chậm,
  # xe tải rộng phanh yếu, và đường trơn (lốp 0,3) trong khi mô hình tham chiếu coi là đường khô → dự kiến va chạm.
  - id: "E5-trig-{trigger_m}"
    group: E5
    kind: combined
    a: 8.0
    grid: {trigger_m: [5, 80]}
  - id: "E5-60-ped3.0"
    group: E5
    kind: combined
    ego_kmh: 60
    a: 8.0
    ped_mps: 3.0
  - id: "E5-20-ped0.5"
    group: E5
    kind: combined
    ego_kmh: 20
    a: 8.0
    ped_mps: 0.5
  - id: "E5-hgv-40"
    group: E5
    kind: combined
    vehicle: hgv
  - id: "E5-tf0.3-40"
    group: E5
    kind: combined
    tire_friction_scale: 0.3

  # E6 — Thông số xe biên: khối lượng × 0,5 / × 2,0, mô-men × 0,2 (e-tron); xe tải mô-men × 5 và chở nặng × 2.
  - id: "E6-etron-m{mass_scale}"
    group: E6
    kind: brake
    ego_kmh: 50
    grid: {mass_scale: [0.5, 2.0]}
  - id: "E6-etron-t0.2"
    group: E6
    kind: brake
    ego_kmh: 50
    torque_scale: 0.2
  - id: "E6-hgv-t5.0"
    group: E6
    kind: brake
    vehicle: hgv
    ego_kmh: 50
    torque_scale: 5.0
  - id: "E6-hgv-m2.0"
    group: E6
    kind: brake
    vehicle: hgv
    mass_scale: 2.0

  # ---------------------------------------------------------------- Lặp lại (độ tất định ở các vùng khó)
  # R — Chạy lại các ca dễ dao động nhất: vùng dừng gấp, xe + người, va chạm, đường ướt, tốc độ cao, đường băng.
  # Đặt cuối file để chạy sau nhiều ca khác (kiểm cả việc CARLA có "trôi" theo thời gian chạy không).
  - id: "R-B1-10-max"
    group: R
    kind: brake
    ego_kmh: 10
    same_as: B1-10-max
    repeat: 3
  - id: "R-B5-xe-50"
    group: R
    kind: combined
    ego_kmh: 50
    a: 8.0
    ped_mps: 1.39
    same_as: B5-xe-50
    repeat: 3
  - id: "R-E5-tf0.3-40"
    group: R
    kind: combined
    tire_friction_scale: 0.3
    same_as: E5-tf0.3-40
    repeat: 3
  - id: "R-X2-model3-40-1.5"
    group: R
    kind: brake
    vehicle: model3
    a: 1.5
    same_as: X2-model3-40-1.5
    repeat: 2
  - id: "R-X3-hgv-60-HEAVY_RAIN"
    group: R
    kind: brake
    vehicle: hgv
    ego_kmh: 60
    weather: HEAVY_RAIN
    same_as: X3-hgv-60-HEAVY_RAIN
    repeat: 2
  - id: "R-B2-80-max"
    group: R
    kind: brake
    ego_kmh: 80
    same_as: B2-80-max
    repeat: 2
  - id: "R-E3-40-tf0.3"
    group: R
    kind: brake
    tire_friction_scale: 0.3
    same_as: E3-40-tf0.3
    repeat: 2
